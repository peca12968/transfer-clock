name: Verify timetable journeys
on: [push, pull_request]
permissions:
  contents: read
jobs:
  route:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python router.py examples/night.csv Studio Depot 23:49:00
      - uses: actions/checkout@v7
        with:
          repository: peca12968/return-radius
          ref: a3d78f802b898eb6751a75ea5bb15a7b629648ff
          path: radius-checkout
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build radius-checkout/ReturnRadius.csproj -c Release
      - run: python dock_checks.py --radius-dll radius-checkout/bin/Release/net10.0/ReturnRadius.dll
