name: Verify spherical station search
on: [push, pull_request]
permissions:
  contents: read
jobs:
  search:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: dotnet build -c Release
      - run: python test_search.py
      - run: dotnet bin/Release/net10.0/ReturnRadius.dll examples/riverside.json
      - uses: actions/checkout@v7
        with:
          repository: peca12968/tile-satchel
          ref: 4d272a2ac74b37c777794bd418a8c9a3cb1ad9bc
          path: tile-satchel
      - run: python -m pip install -r tile-satchel/requirements.txt
      - run: python offline_demo.py tile-satchel
