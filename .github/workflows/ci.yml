name: Verify spherical station search
on: [push, pull_request]
permissions:
  contents: read
jobs:
  search:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: dotnet build -c Release
      - run: python test_search.py
      - run: dotnet bin/Release/net10.0/ReturnRadius.dll examples/riverside.json
